name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  self-scan:
    # Scan this repository's full history with phi-guardrails, pinned to a
    # commit. CI has no patient roster, so this covers the pattern and
    # secret checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "phi-guardrails @ git+https://github.com/kenechi-ucheagwu/phi-guardrails@843405a1da322689ba79707afda1ceb0c862128a"
      - run: phi-guard scan-history . --no-roster
